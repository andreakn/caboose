# Typecheck, tests and a build on the three systems Caboose runs on, at every push.
name: CI
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      # The tests run real git (commits, worktrees, a bare origin).
      - run: git config --global user.email ci@caboose.local && git config --global user.name "Caboose CI" && git config --global init.defaultBranch main
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
